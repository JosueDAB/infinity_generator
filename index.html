  animation:desplazar 30s linear infinite;will-change:background-position;
}
@keyframes desplazar{to{background-position:260px 260px}}   /* el desplazamiento es igual al tamaño del mosaico */

/* Texto de crédito, esquina inferior derecha (sutil, no interactivo) */
#credito{
  position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:max(6px,env(safe-area-inset-bottom,0px));
  z-index:3;pointer-events:none;user-select:none;
  color:#fff;opacity:.55;font:11px/1.2 Arial,Helvetica,sans-serif;letter-spacing:.03em;text-align:right;
}

/* ==========================================================================
   3. ESCENARIO (pantalla de 1336 x 723 px que se escala con JavaScript)
   ========================================================================== */
#stage{position:absolute;left:50%;top:50%;width:1336px;height:723px;transform-origin:center;color:#fff;z-index:1}
#stage>*{position:absolute}                           /* todos los elementos se posicionan dentro del escenario */
#bg{left:0;top:0;width:1336px;height:723px;animation:resplandorMarco 4s ease-in-out infinite}
#bg svg,#logo svg{display:block;width:100%;height:auto}
#logo{left:78px;top:48px;width:270px}

/* Resplandor azul que late alrededor del marco de la pantalla */
@keyframes resplandorMarco{
  0%,100%{filter:drop-shadow(0 0 8px rgba(0,46,92,.55)) drop-shadow(0 0 2px rgba(0,46,92,.5))}
  50%{filter:drop-shadow(0 0 26px rgba(0,46,92,.95)) drop-shadow(0 0 10px rgba(0,46,92,.8))}
}

/* Franjas de colores de las esquinas: cambian de color de forma cíclica y suave */
@keyframes cicloInferior{0%,100%{fill:#762786}25%{fill:#007BB8}50%{fill:#00A69A}75%{fill:#009713}}
@keyframes cicloSuperior{0%,100%{fill:#F12A75}25%{fill:#EE1D0C}50%{fill:#FA6B01}75%{fill:#FFBF00}}
#bg .pfil5,#bg .pfil4,#bg .pfil3,#bg .pfil2{animation:cicloInferior 10s ease-in-out infinite}   /* esquina inferior izquierda */
#bg .pfil6,#bg .pfil7,#bg .pfil8,#bg .pfil9{animation:cicloSuperior 10s ease-in-out infinite}   /* esquina superior derecha */
/* Desfase de cada franja para que los colores "corran" a lo largo del grupo */
#bg .pfil5,#bg .pfil6{animation-delay:0s}
#bg .pfil4,#bg .pfil7{animation-delay:-2.5s}
#bg .pfil3,#bg .pfil8{animation-delay:-5s}
#bg .pfil2,#bg .pfil9{animation-delay:-7.5s}

/* ==========================================================================
   4. FASE CENTRAL (cartas inclinadas en diagonal y su descripción)
   ========================================================================== */
#phase{
  left:60px;top:200px;width:1216px;height:220px;
  display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;justify-content:center;
  transform:rotate(-8deg);pointer-events:none;        /* no bloquea los clics a las franjas */
}
.blk{display:flex;gap:6px}                            /* bloque de cartas (grupo, escalera o color) */
.blk svg{width:58px;height:auto;animation:aparecer .35s both;transform:rotate(var(--r));filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.plus{font-size:52px;line-height:1;color:#fff}
@keyframes aparecer{from{opacity:0;transform:scale(.3) rotate(var(--r))}}   /* efecto de "repartir" la carta */
#txt{left:60px;width:1216px;top:452px;font-size:20px;text-align:center;opacity:.85;padding:0 12px;pointer-events:none}

/* ==========================================================================
   5. BOTONES GENERADORES Y BARRA DE HERRAMIENTAS (rollover, glow y clic)
   ========================================================================== */
#gens,#tools{left:0;top:0;width:0;height:0}           /* contenedores sin tamaño: los botones se colocan en absoluto */
#tools{z-index:3}
.g,.t{position:absolute;background:none;border:0;padding:0;cursor:pointer;transition:transform .18s ease,filter .18s ease}

/* Generadores */
.g{top:553px;width:188px}
.g svg{display:block;width:100%;height:auto;transform-origin:50% 60%}
.g:hover{
  transform:scale(1.08);
  filter:drop-shadow(-14px 2px 7px var(--c1)) drop-shadow(-5px 0 7px var(--c2)) drop-shadow(5px 0 7px var(--c3)) drop-shadow(14px 2px 7px var(--c4));
  animation:pulsoGeneradores 1.2s ease-in-out infinite;
}
.g:active{transform:scale(.94)}
.g.go svg{animation:barajar .7s ease}                 /* animación de barajeo al hacer clic */
@keyframes pulsoGeneradores{                          /* glow multicolor que late */
  0%,100%{filter:drop-shadow(-8px 1px 3px var(--c1)) drop-shadow(-3px 0 3px var(--c2)) drop-shadow(3px 0 3px var(--c3)) drop-shadow(8px 1px 3px var(--c4))}
  50%{filter:drop-shadow(-18px 3px 10px var(--c1)) drop-shadow(-6px 0 10px var(--c2)) drop-shadow(6px 0 10px var(--c3)) drop-shadow(18px 3px 10px var(--c4))}
}
@keyframes barajar{
  0%{transform:none}
  15%{transform:translateX(-14px) rotate(-6deg)}
  30%{transform:translateX(14px) rotate(6deg)}
  45%{transform:translateX(-10px) rotate(-4deg)}
  60%{transform:translateX(10px) rotate(4deg)}
  80%{transform:scale(1.15) rotate(-2deg)}
  100%{transform:none}
}

/* Herramientas */
.t{top:26px;width:68px;height:68px}
.t svg{display:block;width:100%;height:100%}
.t:hover{
  transform:scale(1.18);
  filter:drop-shadow(0 0 9px var(--c)) drop-shadow(0 0 3px var(--c));
  animation:pulsoHerramienta 1.2s ease-in-out infinite;
}
.t:active{transform:scale(.88)}
.t.off svg{opacity:.45}                               /* botón de audio silenciado */
.t .sl{position:absolute;inset:0;pointer-events:none} /* raya diagonal sobre el altavoz */
@keyframes pulsoHerramienta{                          /* glow de un solo color que late */
  0%,100%{filter:drop-shadow(0 0 3px var(--c)) drop-shadow(0 0 1px var(--c))}
  50%{filter:drop-shadow(0 0 14px var(--c)) drop-shadow(0 0 6px var(--c))}
}

/* ==========================================================================
   6. MENÚ DESPLEGABLE DE IDIOMAS
   ========================================================================== */
#lm{left:0;top:0;width:0;height:0;display:none;z-index:2}
#lm.on{display:block}
#lmt,#lmp{position:absolute;background:#070026;border:2px solid #F12A75;transform-origin:30px 0;animation:entradaMenu .2s ease-out}
#lmt{left:581px;top:18px;width:84px;height:82px;border-bottom:0;border-radius:24px 24px 0 0;z-index:2;box-shadow:0 0 14px rgba(241,42,117,.35)}   /* pestaña tras el globo */
#lmp{left:581px;top:98px;width:236px;padding:12px;border-radius:0 22px 22px 22px;display:grid;gap:8px;box-shadow:0 0 18px rgba(241,42,117,.3);z-index:1}   /* panel con las opciones */
#lmp::before{content:"";position:absolute;left:-2px;top:-3px;width:80px;height:4px;background:#070026}   /* une visualmente pestaña y panel */
@keyframes entradaMenu{from{opacity:0;transform:translateY(-8px) scale(.94)}}
.li{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border:0;border-radius:12px;background:#1b1640;color:#fff;font:700 16px Arial,sans-serif;cursor:pointer;text-align:left;transition:background .15s,transform .15s}
.li:hover{background:#2a2260;transform:translateX(3px)}
.li.sel{background:#F12A75;box-shadow:0 0 12px rgba(241,42,117,.6)}   /* idioma activo */
.li b{width:20px;font-size:20px}                      /* marca ✔ */

/* ==========================================================================
   7. VENTANAS EMERGENTES (guía, historial, cierre y resultado de token)
   ========================================================================== */
#ov{position:fixed;inset:0;background:rgba(3,2,20,.85);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#ov.on{display:flex}
#box{background:#070026;color:#fff;border:2px solid #052650;border-radius:20px;max-width:520px;width:100%;max-height:80%;overflow:auto;padding:18px;font-family:Arial,sans-serif;line-height:1.5}
#box.w{max-width:820px;background:linear-gradient(160deg,#0d0838,#070026);border:2px solid #002E5C;box-shadow:0 0 40px rgba(0,46,92,.8)}   /* variante ancha (guía e historial) */
#box h2{margin:0 0 10px;font-family:"Arial Black",Arial}
#box li{margin:4px 0}
#box button{margin-top:12px;padding:11px 26px;border:0;border-radius:20px;background:#F12A75;color:#fff;font-weight:700;font-size:clamp(15px,4vw,17px);cursor:pointer}
#box button.clr{display:block;margin:16px auto 0;background:#762786}   /* botón "Borrar historial" */

/* --- Encabezados y filas de la guía --- */
.hh h2{font-size:28px;margin:0;background:linear-gradient(90deg,#F12A75,#FA6B01,#FFBF00,#009713,#007BB8,#762786);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:4px 0 6px;opacity:.75;font-size:14px}
#box h3{margin:20px 0 10px;font:700 13px Arial;letter-spacing:.14em;text-transform:uppercase;color:#FFBF00}
.rg{display:grid;gap:10px}
.rg.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.rw{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.05);border-left:4px solid var(--c);border-radius:14px;padding:10px 14px}
.ri{flex:none}
.ri svg{display:block;width:100%;height:auto}
.rt b{font-size:15px}
.rt p,.rw.ex p{margin:2px 0 0;font-size:14px;opacity:.85}
.rw.ex{flex-direction:column;align-items:flex-start;gap:8px}   /* ejemplos de "Cómo leer una fase" */
.rw.ex p{margin:0}

/* --- Cartas en miniatura (guía e historial) --- */
.hm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.hm .blk{display:flex;gap:2px}
.hm .blk svg{width:20px;height:auto;animation:none;filter:none}
.hm .pl{font-size:18px;line-height:1}
.hm.lg .blk svg{width:30px}
.hm.lg .pl{font-size:24px}

/* --- Historial --- */
.hl{display:grid;gap:8px;margin-top:12px}
.he{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.05);border-left:4px solid var(--c);border-radius:14px;padding:10px 12px;cursor:pointer;transition:transform .15s,background .15s}
.he:hover{transform:translateX(4px);background:rgba(255,255,255,.1)}
.hn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);color:#070026;font:900 14px Arial;display:flex;align-items:center;justify-content:center}
.hb{flex:1;min-width:0}
.hd{font-size:13px;opacity:.8;margin-top:4px}
.hm2{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px}
.bd{background:var(--c);color:#070026;border-radius:10px;padding:2px 8px;font-weight:700}
.tm{opacity:.6}
.cnt{background:#F12A75;border-radius:10px;padding:1px 8px;font-weight:700}
.emp{text-align:center;padding:30px 10px;opacity:.85}
.emp div{font-size:56px}

/* ==========================================================================
   8. FUNCIÓN SECRETA: LLUVIA DE TOKENS EN 3D (no se menciona en la interfaz)
   ========================================================================== */
#rain{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden;perspective:900px}
.tk{
  --w:min(120px,22vw);
  position:absolute;top:0;width:var(--w);aspect-ratio:1;
  transform-style:preserve-3d;pointer-events:auto;cursor:pointer;will-change:transform;
  animation:caer var(--d) cubic-bezier(.35,.05,.75,.95) var(--dl) both;   /* --d, --dl, etc. los asigna JavaScript */
}
.tk svg{display:block;width:100%;height:auto}
.tk .rm{position:absolute;inset:1.2%;border-radius:50%;background:#0b4f86;backface-visibility:visible}   /* capas del canto (grosor) */
.tk .rm:nth-child(odd){background:#0a3f6e}
.tk .rm:nth-child(4n){background:#1370b5}
.tk .fc,.tk .fb{position:absolute;inset:0;backface-visibility:hidden}   /* cara frontal y trasera */
.tk .fc{transform:translateZ(calc(var(--w)*.062))}
.tk .fb{transform:rotateY(180deg) translateZ(calc(var(--w)*.062))}
.tk.got{animation:atrapado .35s ease-out both!important}   /* moneda capturada */
.tk.bye{transition:opacity .3s;opacity:0}                  /* monedas descartadas */
@keyframes caer{
  0%{transform:translate3d(0,-180px,0) rotateX(var(--tx)) rotateY(0) rotateZ(var(--r0))}
  100%{transform:translate3d(var(--sw),calc(100vh + 220px),0) rotateX(var(--tx)) rotateY(var(--sp)) rotateZ(var(--r1))}
}
@keyframes atrapado{to{transform:scale(1.6);opacity:0}}

/* --- Ventana de resultado del token --- */
.tkr{text-align:center}
.tkr .tkb{width:min(170px,38vw);margin:0 auto 8px;animation:aparicionToken .6s ease-out}
.tkb svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 16px rgba(79,195,247,.7))}   /* glow celeste */
.tkr small{font:700 clamp(13px,3.4vw,15px) Arial;letter-spacing:.12em;text-transform:uppercase;color:#FFBF00}
.tkr h2{margin:6px 0 10px!important;font-size:clamp(24px,6.5vw,30px)}
.tkr .tkw{background:rgba(255,255,255,.07);border:1px solid #F12A75;border-radius:14px;padding:10px 12px;margin:0 0 12px}
.tkr .tkw b{display:block;font-size:clamp(18px,4.8vw,22px);margin-top:4px}
.tkr p{text-align:left;font-size:clamp(16px,4.3vw,19px);line-height:1.55;margin:0}
@keyframes aparicionToken{from{transform:scale(.3) rotateY(180deg);opacity:0}}

@media (prefers-reduced-motion:reduce){
  #pat,#bg{animation:none}
  #bg path,#bg polygon{animation:none!important}
}

/* Colores de las cartas de "mismo color" */
const PALETA_CARTAS = ['#F0307A', '#E8281B', '#FF7A00', '#FFC400', '#0A9A2A', '#10A8A0', '#1B84C4', '#7B2D91'];

/* Posición horizontal (en px del escenario) de cada botón */
const POS_GENERADORES_X = [423, 631, 841, 1051];
const POS_HERRAMIENTAS_X = [425, 491, 557, 623, 689, 755, 821, 887];

/* Color principal de cada botón (se usa en el glow y en las etiquetas de la guía) */
const COLOR_GENERADOR = ['#F12A75', '#00A69A', '#FFBF00', '#F12A75'];
const COLOR_HERRAMIENTA = ['#FFBF00', '#FA6B01', '#EE1D0C', '#F12A75', '#009713', '#00A69A', '#007BB8', '#762786'];

/* Los 4 colores del glow multicolor de cada generador, como variables CSS (--c1 ... --c4) */
const GLOW_GENERADORES = [
  ['#F12A75', '#EE1D0C', '#FA6B01', '#FFBF00'],   /* aleatorias */
  ['#009713', '#00A69A', '#007BB8', '#762786'],   /* grupos */
  ['#EE1D0C', '#FFBF00', '#009713', '#007BB8'],   /* escaleras */
  ['#F12A75', '#FF5C9A', '#C81E62', '#FF8FB8']    /* mismo color */
].map(colores => colores.map((c, j) => '--c' + (j + 1) + ':' + c).join(';'));

/* Medidas del escenario (deben coincidir con el CSS de #stage) */
const ESCENARIO_ANCHO = 1336;
const ESCENARIO_ALTO = 723;

/* ==========================================================================
   3. ESTADO GLOBAL Y UTILIDADES
   ========================================================================== */
const IDIOMAS = Object.keys(TEXTOS);
let idioma = 'es';                              /* idioma activo */
let silenciado = false;                         /* true = sin sonido */
let historial = [];                             /* fases generadas en la partida */
let faseActual = null;                          /* fase mostrada en el centro */
let girada = innerHeight > innerWidth;          /* true = pantalla girada 90° (modo vertical) */
let menuIdiomaAbierto = false;

const $ = selector => document.querySelector(selector);     /* atajo para seleccionar elementos */
const T = () => TEXTOS[idioma];                              /* textos del idioma activo */
const aleatorioEntre = (min, max) => min + Math.floor(Math.random() * (max - min + 1));

/* ==========================================================================
   4. AUDIO (efectos sintéticos con Web Audio API)
   ========================================================================== */
let contextoAudio;

/* Crea el contexto de audio la primera vez que se necesita */
function audio() {
  return contextoAudio || (contextoAudio = new (window.AudioContext || window.webkitAudioContext)());
}

/* Reproduce una nota: frecuencia, duración, retardo, tipo de onda, volumen y frecuencia final opcional */
function tono(frecuencia, duracion, retardo = 0, tipo = 'sine', volumen = .15, frecuenciaFinal) {
  if (silenciado) return;
  const a = audio(), osc = a.createOscillator(), ganancia = a.createGain(), inicio = a.currentTime + retardo;
  osc.type = tipo;
  osc.frequency.setValueAtTime(frecuencia, inicio);
  if (frecuenciaFinal) osc.frequency.exponentialRampToValueAtTime(frecuenciaFinal, inicio + duracion);
  ganancia.gain.setValueAtTime(volumen, inicio);
  ganancia.gain.exponentialRampToValueAtTime(.001, inicio + duracion);
  osc.connect(ganancia).connect(a.destination);
  osc.start(inicio);
  osc.stop(inicio + duracion);
}

/* Reproduce una ráfaga de ruido filtrado (se usa para el sonido de barajeo) */
function ruido(retardo, duracion) {
  if (silenciado) return;
  const a = audio(), muestras = a.sampleRate * duracion, buffer = a.createBuffer(1, muestras, a.sampleRate), datos = buffer.getChannelData(0);
  for (let i = 0; i < muestras; i++) datos[i] = (Math.random() * 2 - 1) * (1 - i / muestras);   /* ruido que se desvanece */
  const fuente = a.createBufferSource(), filtro = a.createBiquadFilter(), ganancia = a.createGain();
  filtro.type = 'bandpass';
  filtro.frequency.value = 2500;
  ganancia.gain.value = .25;
  fuente.buffer = buffer;
  fuente.connect(filtro).connect(ganancia).connect(a.destination);
  fuente.start(a.currentTime + retardo);
}

/* Barajeo de cartas: 7 ráfagas de ruido seguidas (sonido de los 4 generadores) */
const sonidoBarajo = () => { for (let i = 0; i < 7; i++) ruido(i * .06, .07); };

/* Clic unificado para todos los botones de configuración */
const sonidoClick = () => { tono(700, .07, 0, 'square', .07); tono(1000, .06, .04, 'square', .05); };

/* Confirmación de éxito: arpegio ascendente (nueva fase o token atrapado) */
const sonidoExito = () => [523, 659, 784, 1047].forEach((f, i) => tono(f, .22, .25 + i * .08, 'sine', .13));

/* Tintineo suave al pasar el cursor; se limita a uno cada 70 ms para no saturar */
let ultimoHover = 0;
function sonidoHover() {
  const ahora = performance.now();
  if (ahora - ultimoHover < 70) return;
  ultimoHover = ahora;
  tono(988, .12, 0, 'sine', .045);
  tono(1480, .16, .04, 'sine', .03);
}

/* ==========================================================================
   5. GENERADOR DE FASES
   Una fase es una lista de bloques: { tipo, cantidad, color }
     tipo: 'grupo' (mismo número) · 'escalera' (consecutivas) · 'color' (mismo color)
   ========================================================================== */

/* Genera una fase aleatoria. modo: 0 = aleatoria, 1 = grupos, 2 = escaleras, 3 = mismo color */
function generarFase(modo) {
  let numBloques, tipos = [];
  if (modo == 1) { numBloques = Math.random() < .7 ? 2 : 3; tipos = Array(numBloques).fill('grupo'); }
  else if (modo == 2) { numBloques = Math.random() < .5 ? 1 : 2; tipos = Array(numBloques).fill('escalera'); }
  else if (modo == 3) { numBloques = Math.random() < .7 ? 1 : 2; tipos = Array(numBloques).fill('color'); }
  else {
    numBloques = aleatorioEntre(1, 3);
    for (let i = 0; i < numBloques; i++) tipos.push(['grupo', 'escalera', 'color'][aleatorioEntre(0, 2)]);
  }

  const MINIMO = { grupo: 2, escalera: 3, color: 3 };      /* cartas mínimas por tipo */
  const MAXIMO = { grupo: 5, escalera: 9, color: 8 };      /* cartas máximas por tipo */
  const colores = PALETA_CARTAS.slice().sort(() => Math.random() - .5);   /* colores en orden aleatorio */
  const bloques = [];
  let usadas = 0;                                          /* cartas ya asignadas (tope total: 12) */

  tipos.forEach((tipo, i) => {
    const tope = Math.min(MAXIMO[tipo], 12 - usadas - 3 * (numBloques - 1 - i));   /* deja sitio a los bloques restantes */
    const piso = numBloques == 1 && tipo != 'grupo' ? Math.min(6, tope) : MINIMO[tipo];
    let cantidad = aleatorioEntre(Math.min(piso, tope), tope);
    if (numBloques == 1 && tipo == 'grupo') cantidad = Math.max(cantidad, 4);
    usadas += cantidad;
    bloques.push({ tipo, cantidad, color: tipo == 'color' ? colores.pop() : null });
  });

  /* Con varios grupos, a veces se igualan sus tamaños (ej.: 2 grupos de 4) */
  if (bloques.length > 1 && bloques.every(b => b.tipo == 'grupo') && Math.random() < .6) {
    const cantidad = aleatorioEntre(3, 5);
    bloques.forEach(b => b.cantidad = cantidad);
  }
  return bloques;
}

/* Describe una fase con texto en el idioma activo (une bloques iguales: "2 grupos de 4") */
function describirFase(fase) {
  const t = T(), partes = [];
  for (let i = 0; i < fase.length; i++) {
    const b = fase[i];
    if (b.tipo == 'color') { partes.push(t.color[0].replace('{n}', b.cantidad)); continue; }
    let repetidos = 1;
    while (i + 1 < fase.length && fase[i + 1].tipo == b.tipo && fase[i + 1].cantidad == b.cantidad) { repetidos++; i++; }
    partes.push(t[b.tipo][repetidos > 1 ? 1 : 0].replace('{c}', repetidos).replace('{n}', b.cantidad));
  }
  return partes.join(' + ');
}

/* ==========================================================================
   6. DIBUJO DE CARTAS Y FASES
   ========================================================================== */

/* Dibuja una carta en SVG. Con color de fondo = carta lisa; sin color = carta blanca con letra */
function cartaSVG(bloque, letra, indice) {
  const giro = indice % 2 ? 2.5 : -2.5;                    /* inclinación alterna para dar naturalidad */
  const estilo = `--r:${giro}deg;animation-delay:${indice * 40}ms`;
  if (bloque.color) {
    return `<svg viewBox="0 0 44 64" style="${estilo}"><rect x="1.5" y="1.5" width="41" height="61" rx="6" fill="${bloque.color}" stroke="#fff" stroke-width="3"/></svg>`;
  }
  return `<svg viewBox="0 0 44 64" style="${estilo}"><rect x="1.5" y="1.5" width="41" height="61" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/><text x="22" y="43" text-anchor="middle" font-family="Arial Black,Arial,Helvetica,sans-serif" font-style="italic" font-weight="900" font-size="34" fill="#000">${letra}</text></svg>`;
}

/* Crea el HTML de las cartas de una fase, con "+" entre bloques (clasePlus = estilo del signo).
   Las letras: los grupos usan A, B, C...; las escaleras recorren A, B, C, D... */
function bloquesHTML(fase, clasePlus = 'plus') {
  let gruposUsados = 0, html = '';
  fase.forEach((bloque, i) => {
    if (i) html += `<span class="${clasePlus}">+</span>`;
    const letraGrupo = 'ABC'[gruposUsados];
    if (bloque.tipo == 'grupo') gruposUsados++;
    html += '<div class="blk">';
    for (let k = 0; k < bloque.cantidad; k++) html += cartaSVG(bloque, bloque.tipo == 'grupo' ? letraGrupo : String.fromCharCode(65 + k), k);
    html += '</div>';
  });
  return html;
}

/* Muestra una fase en la zona central junto con su descripción */
function dibujarFase(fase) {
  $('#phase').innerHTML = bloquesHTML(fase);
  $('#txt').textContent = describirFase(fase);
}

/* Cartas en miniatura para la guía y el historial (grande = ejemplo de la guía) */
function miniaturaHTML(fase, grande) {
  return '<div class="hm' + (grande ? ' lg' : '') + '">' + bloquesHTML(fase, 'pl') + '</div>';
}

/* Acción de un botón generador: sonido, animación del botón y nueva fase */
function crearFase(modo) {
  sonidoBarajo();
  const boton = document.querySelector('.g[data-i="' + modo + '"]');
  if (boton) { boton.classList.remove('go'); void boton.offsetWidth; boton.classList.add('go'); }   /* reinicia la animación */
  faseActual = generarFase(modo);
  faseActual.hora = Date.now();                            /* se guardan para el historial */
  faseActual.modo = modo;
  historial.push(faseActual);
  dibujarFase(faseActual);
  sonidoExito();
}

/* ==========================================================================
   7. INTERFAZ: BOTONES, VENTANAS, ESCALA Y MENÚ DE IDIOMAS
   ========================================================================== */

/* Construye (o reconstruye al cambiar de idioma o de audio) los botones de la pantalla */
function construirInterfaz() {
  const t = T();
  $('#gens').innerHTML = BOTONES_GENERADORES.map((svg, i) =>
    `<button class="g" style="left:${POS_GENERADORES_X[i]}px;${GLOW_GENERADORES[i]}" data-i="${i}" title="${t.generadores[i]}" aria-label="${t.generadores[i]}">${svg}</button>`).join('');
  $('#tools').innerHTML = ICONOS_BARRA.map((svg, i) => {
    const apagado = i == 2 && silenciado;                  /* el altavoz se tacha si está silenciado */
    const raya = apagado ? '<svg class="sl" viewBox="0 0 100 100"><path d="M22 20L80 82" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>' : '';
    return `<button class="t${apagado ? ' off' : ''}" style="left:${POS_HERRAMIENTAS_X[i] - 34}px;--c:${COLOR_HERRAMIENTA[i]}" data-i="${i}" title="${t.herramientas[i]}" aria-label="${t.herramientas[i]}">${svg}${raya}</button>`;
  }).join('');
  document.querySelectorAll('.g').forEach(b => b.onclick = () => crearFase(+b.dataset.i));
  document.querySelectorAll('.t').forEach(b => b.onclick = () => accionHerramienta(+b.dataset.i));
  document.querySelectorAll('.g,.t').forEach(b => b.onmouseenter = sonidoHover);
  if (faseActual) dibujarFase(faseActual); else $('#txt').textContent = t.pista;
}

/* Abre la ventana emergente con el contenido indicado (ancha = variante grande) */
function abrirVentana(html, ancha) {
  $('#box').className = ancha ? 'w' : '';
  $('#box').innerHTML = html + `<button data-accion="cerrar">${T().cerrar}</button>`;
  $('#ov').classList.add('on');
}
const cerrarVentana = () => $('#ov').classList.remove('on');

/* Acciones de los botones dentro de las ventanas (delegación de eventos) */
$('#box').addEventListener('click', e => {
  const boton = e.target.closest('button[data-accion]');
  if (!boton) return;
  const accion = boton.dataset.accion;
  if (accion == 'cerrar') cerrarVentana();
  else if (accion == 'recargar') location.reload();
  else if (accion == 'borrar-historial') { historial = []; abrirHistorial(); }
});

/* Acción de cada botón de la barra de herramientas */
function accionHerramienta(i) {
  if (i == 2) {                                            /* audio: activar / silenciar */
    silenciado = !silenciado;
    if (!silenciado) sonidoClick();
    construirInterfaz();
    return;
  }
  sonidoClick();
  if (i == 0) {                                            /* reinicio: limpia la partida */
    historial = [];
    faseActual = null;
    $('#phase').innerHTML = '';
    cerrarVentana();
    construirInterfaz();
  }
  if (i == 1) abrirHistorial();                            /* historial */
  if (i == 3) { menuIdiomaAbierto ? cerrarMenuIdioma() : abrirMenuIdioma(); }   /* idioma */
  if (i == 4) abrirVentana(guiaHTML(), true);              /* ayuda */
  if (i == 5) { girada = !girada; ajustarEscala(); }       /* orientación */
  if (i == 6) {                                            /* pantalla completa */
    try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {}
  }
  if (i == 7) {                                            /* cerrar la aplicación */
    try { window.close(); } catch (e) {}                   /* el navegador puede bloquearlo */
    abrirVentana(`<h2>${T().cerrada}</h2><button data-accion="recargar">${T().reabrir}</button>`);
  }
}

/* Escala el escenario para que quepa en la ventana; si está girada, lo rota 90° */
function ajustarEscala() {
  const ancho = girada ? ESCENARIO_ALTO : ESCENARIO_ANCHO, alto = girada ? ESCENARIO_ANCHO : ESCENARIO_ALTO;
  const escala = Math.min(innerWidth / ancho, innerHeight / alto) * .98;
  $('#stage').style.transform = `translate(-50%,-50%) ${girada ? 'rotate(90deg) ' : ''}scale(${escala})`;
}

/* --- Menú desplegable de idiomas --- */
function dibujarMenuIdioma() {
  $('#lmp').innerHTML = IDIOMAS.map(l => `<button class="li${l == idioma ? ' sel' : ''}" data-l="${l}"><b>${l == idioma ? '✔' : ''}</b>${TEXTOS[l].nombre}</button>`).join('');
  document.querySelectorAll('.li').forEach(b => {
    b.onmouseenter = sonidoHover;
    b.onclick = () => {                                    /* elegir un idioma lo aplica de inmediato */
      sonidoClick();
      idioma = b.dataset.l;
      document.documentElement.lang = idioma;
      cerrarMenuIdioma();
      construirInterfaz();
    };
  });
}
function abrirMenuIdioma() { menuIdiomaAbierto = true; dibujarMenuIdioma(); $('#lm').classList.add('on'); }
function cerrarMenuIdioma() { menuIdiomaAbierto = false; $('#lm').classList.remove('on'); }

/* ==========================================================================
   8. VENTANAS: GUÍA E HISTORIAL
   ========================================================================== */

/* Fila con icono + título + explicación (guía) */
function filaGuiaHTML(icono, titulo, descripcion, anchoIcono, color) {
  return `<div class="rw" style="--c:${color}"><div class="ri" style="width:${anchoIcono}px">${icono}</div><div class="rt"><b>${titulo}</b><p>${descripcion}</p></div></div>`;
}

/* Guía de uso: cómo leer una fase, generadores y barra de herramientas (en ese orden) */
function guiaHTML() {
  const g = TEXTOS_GUIA[idioma], t = T();
  const ejemplos = [                                       /* ejemplos visuales de "Cómo leer una fase" */
    [{ tipo: 'grupo', cantidad: 3 }],
    [{ tipo: 'escalera', cantidad: 4 }],
    [{ tipo: 'grupo', cantidad: 3 }, { tipo: 'escalera', cantidad: 4 }],
    [{ tipo: 'color', cantidad: 4, color: '#F12A75' }]
  ];
  const coloresEjemplo = ['#009713', '#007BB8', '#FA6B01', '#F12A75'];
  const lectura = `<h3>${g.secciones[2]}</h3><div class="rg two">` +
    ejemplos.map((fase, i) => `<div class="rw ex" style="--c:${coloresEjemplo[i]}">${miniaturaHTML(fase, true)}<p>${g.lectura[i]}</p></div>`).join('') + '</div>';
  const generadores = `<h3>${g.secciones[0]}</h3><div class="rg">` +
    BOTONES_GENERADORES.map((svg, i) => filaGuiaHTML(svg, t.generadores[i], g.generadores[i], 118, COLOR_GENERADOR[i])).join('') + '</div>';
  const herramientas = `<h3>${g.secciones[1]}</h3><div class="rg two">` +
    ICONOS_BARRA.map((svg, i) => filaGuiaHTML(svg, t.herramientas[i], g.herramientas[i], 46, COLOR_HERRAMIENTA[i])).join('') + '</div>';
  return `<div class="hh"><h2>${g.titulo}</h2><p class="sub">${g.intro}</p></div>` + lectura + generadores + herramientas;
}

/* Historial: lista de fases generadas (la más reciente primero) */
function historialHTML() {
  const g = TEXTOS_GUIA[idioma], t = T();
  if (!historial.length) return `<div class="hh"><h2>${t.historial}</h2></div><div class="emp"><div>🃏</div><p>${g.vacio}</p></div>`;
  const filas = historial.map((fase, i) => [fase, i]).reverse().map(([fase, i]) => {
    const modo = fase.modo || 0;
    const hora = fase.hora ? new Date(fase.hora).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    return `<div class="he" data-i="${i}" style="--c:${COLOR_GENERADOR[modo]}"><div class="hn">${i + 1}</div><div class="hb">${miniaturaHTML(fase)}<div class="hd">${describirFase(fase)}</div></div><div class="hm2"><span class="bd">${t.generadores[modo]}</span><span class="tm">${hora}</span></div></div>`;
  }).join('');
  return `<div class="hh"><h2>${t.historial}</h2><p class="sub"><span class="cnt">${historial.length}</span> ${g.unidad_fases} · ${g.pista_historial}</p></div><div class="hl">${filas}</div>` +
    `<button class="clr" data-accion="borrar-historial">${g.borrar}</button>`;
}

/* Abre el historial; al tocar una fase vuelve a mostrarse en el centro */
function abrirHistorial() {
  abrirVentana(historialHTML(), true);
  document.querySelectorAll('.he').forEach(fila => fila.onclick = () => {
    faseActual = historial[+fila.dataset.i];
    dibujarFase(faseActual);
    cerrarVentana();
    sonidoExito();
  });
}

/* ==========================================================================
   9. FUNCIÓN SECRETA: LLUVIA DE TOKENS (oculta, sin mención en la interfaz)
   Al tocar una por una las 8 franjas de colores hay un 20 % de probabilidad de
   que caigan 4 monedas 3D. Al atrapar una, una regla al azar decide a qué
   jugador se le otorga y se muestra su explicación.
   ========================================================================== */
let franjasPulsadas = new Set();                           /* franjas distintas tocadas */
let lluviaActiva = false;

/* Crea el HTML 3D de una moneda: capas de canto + cara frontal y trasera */
function monedaHTML(k) {
  let html = '';
  for (let i = -4; i <= 4; i++) html += `<i class="rm" style="transform:translateZ(calc(var(--w)*${(i * .014).toFixed(3)}))"></i>`;
  return html + `<div class="fc">${SVG_TOKENS[k]}</div><div class="fb">${SVG_TOKENS[k]}</div>`;
}

/* Hace caer los 4 tokens con valores aleatorios de posición, velocidad y giro */
function iniciarLluviaTokens() {
  if (lluviaActiva) return;
  lluviaActiva = true;
  const capa = $('#rain');
  [880, 1175, 1568, 2093].forEach((f, i) => tono(f, .25, i * .09, 'sine', .07));   /* destello sonoro */
  const columnas = [8, 30, 52, 74].sort(() => Math.random() - .5);                  /* posición horizontal (vw) */
  [0, 1, 2, 3].sort(() => Math.random() - .5).forEach((k, i) => {
    const moneda = document.createElement('div');
    moneda.className = 'tk';
    moneda.innerHTML = monedaHTML(k);
    const e = moneda.style;
    e.left = (columnas[i] + Math.random() * 8) + 'vw';
    e.setProperty('--d', (5.63 + Math.random() * 2.75).toFixed(2) + 's');           /* duración de la caída */
    e.setProperty('--dl', (i * .55 + Math.random() * .4).toFixed(2) + 's');         /* retardo de salida */
    e.setProperty('--sw', ((Math.random() - .5) * 160).toFixed(0) + 'px');          /* balanceo lateral */
    e.setProperty('--sp', ((Math.random() < .5 ? -1 : 1) * (1080 + Math.random() * 720)).toFixed(0) + 'deg');   /* giro 3D */
    e.setProperty('--tx', (15 + Math.random() * 30).toFixed(0) + 'deg');            /* inclinación */
    e.setProperty('--r0', ((Math.random() - .5) * 30).toFixed(0) + 'deg');
    e.setProperty('--r1', ((Math.random() - .5) * 50).toFixed(0) + 'deg');
    moneda.onclick = () => atraparToken(moneda, k);
    moneda.addEventListener('animationend', ev => { if (ev.animationName == 'caer') { moneda.remove(); revisarLluvia(); } });
    capa.appendChild(moneda);
  });
}

/* Cuando ya no quedan monedas en pantalla, el evento termina */
function revisarLluvia() { if (!$('#rain').children.length) lluviaActiva = false; }

/* Captura una moneda: descarta las demás y muestra el resultado */
function atraparToken(moneda, k) {
  if (moneda.classList.contains('got')) return;
  moneda.classList.add('got');
  [...$('#rain').children].forEach(otra => { if (otra !== moneda) otra.classList.add('bye'); });
  sonidoExito();
  const t = TEXTOS_TOKENS[idioma], regla = t.reglas[Math.floor(Math.random() * 8)];   /* una de las 8 reglas al azar */
  setTimeout(() => {
    $('#rain').innerHTML = '';
    lluviaActiva = false;
    abrirVentana(`<div class="tkr"><small>${t.atrapado}</small><div class="tkb">${SVG_TOKENS[k]}</div><h2>${t.nombres[k]}</h2><div class="tkw"><small>${t.regla_sorteada}</small><b>${regla}</b></div><p>${t.descripciones[k]}</p></div>`);
  }, 380);
}

/* Detecta los clics en las 8 franjas (clases pfil2 a pfil9 del fondo) */
$('#bg').addEventListener('click', e => {
  const clase = e.target.getAttribute && e.target.getAttribute('class');
  if (!clase || !/^pfil[2-9]$/.test(clase)) return;
  franjasPulsadas.add(clase);
  if (franjasPulsadas.size == 8) {                         /* ya se tocaron las 8 */
    franjasPulsadas = new Set();
    if (Math.random() < .2) iniciarLluviaTokens();         /* 20 % de probabilidad */
  }
});

/* ==========================================================================
   10. EVENTOS GLOBALES E INICIO
   ========================================================================== */
/* Cerrar la ventana al tocar fuera de ella */
$('#ov').onclick = e => { if (e.target.id == 'ov') cerrarVentana(); };

/* Cerrar el menú de idiomas al tocar fuera de él */
addEventListener('pointerdown', e => {
  if (menuIdiomaAbierto && !e.target.closest('#lm,.t[data-i="3"]')) cerrarMenuIdioma();
});

/* Tecla Esc: cierra menú y ventana */
addEventListener('keydown', e => { if (e.key == 'Escape') { cerrarMenuIdioma(); cerrarVentana(); } });

/* Reescalar al cambiar el tamaño de la ventana */
addEventListener('resize', ajustarEscala);

/* Inicio */
ajustarEscala();
construirInterfaz();
</script>
